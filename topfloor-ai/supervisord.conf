[supervisord]
nodaemon=true

[program:api]
command=/bin/sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=celery -A app.core.celery_app.celery_app worker -l info -Q default --pool=threads --concurrency=4
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true
